<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EMBASANA STOCK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; margin: 0; -webkit-tap-highlight-color: transparent; }
        .input-box { width: 100%; background: #fff; border-radius: 1rem; padding: 0.8rem; border: 1px solid #e2e8f0; font-weight: 700; transition: all 0.2s; outline: none; font-size: 0.85rem; }
        .input-box:focus { border-color: #22c55e; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1); }
        .btn-main { background: #0f172a; color: white; padding: 1.2rem; border-radius: 1.2rem; font-weight: 900; text-transform: uppercase; font-style: italic; width: 100%; transition: all 0.2s; border: none; cursor: pointer; }
        .btn-green { background: #22c55e; color: white; padding: 1rem; border-radius: 1rem; font-weight: 800; text-transform: uppercase; width: 100%; }
        .nav-bar { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: white; height: 75px; border-radius: 40px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 15px 30px rgba(0,0,0,0.1); z-index: 100; border: 1px solid #f1f5f9; }
        .plus-btn { width: 65px; height: 65px; background: #22c55e; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; margin-bottom: 40px; border: 5px solid #f8fafc; box-shadow: 0 10px 20px rgba(34, 197, 94, 0.3); }
        #notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 24px; border-radius: 12px; color: white; font-weight: 800; display: none; text-transform: uppercase; font-size: 0.7rem; }
        .card { background: white; border-radius: 2rem; padding: 1.5rem; border: 1px solid #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        #reader { width: 100%; border-radius: 1.5rem; overflow: hidden; border: 2px solid #22c55e; margin-bottom: 1rem; background: #000; min-height: 200px; }
        .modal { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); z-index: 200; display: none; padding: 1rem; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
        .section-title { font-size: 10px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 8px; border-left: 3px solid #22c55e; padding-left: 8px; }
    </style>
</head>
<body>

    <div id="notification"></div>
    <div id="root"></div>
    <div id="modal" class="modal" onclick="closeModal(event)"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByMJBcH3pdeybyyDEEukdGZjB7vxmH4jA",
            authDomain: "embasana-stock-1a7b9.firebaseapp.com",
            projectId: "embasana-stock-1a7b9",
            storageBucket: "embasana-stock-1a7b9.firebasestorage.app",
            appId: "1:5607146974:web:1f9fc894fc31e56ab8894f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = 'embasana-stock-prod';

        window.state = {
            view: localStorage.getItem('embasana_session') ? 'dashboard' : 'login',
            user: JSON.parse(localStorage.getItem('embasana_session')) || null,
            inventory: [],
            users: [],
            isScanning: false,
            searchFilters: { size: '', gauge: '', color: '', batch: '' },
            filteredResults: null,
            selectedItem: null
        };

        window.showNotify = (msg, success = false) => {
            const n = document.getElementById('notification');
            if(!n) return;
            n.innerText = msg;
            n.style.display = 'block';
            n.style.backgroundColor = success ? '#22c55e' : '#ef4444';
            setTimeout(() => n.style.display = 'none', 3000);
        };

        window.doLogin = (e) => {
            e.preventDefault();
            const userInput = document.getElementById('lUser').value.trim().toUpperCase();
            const pinInput = document.getElementById('lPin').value;
            if (userInput === 'ADMIN' && pinInput === 'master2024') {
                window.state.user = { name: 'ADMIN', role: 'admin' };
                saveAndGo();
                return;
            }
            const found = window.state.users.find(u => u.name.toUpperCase() === userInput);
            if (found && pinInput === '1234') {
                window.state.user = { name: found.name, role: 'user' };
                saveAndGo();
            } else {
                showNotify("ACCESO DENEGADO");
            }
        };

        function saveAndGo() {
            localStorage.setItem('embasana_session', JSON.stringify(window.state.user));
            window.state.view = 'dashboard';
            render();
        }

        window.setView = (v) => {
            if (window.state.isScanning) stopScanner();
            window.state.view = v;
            window.state.filteredResults = null;
            render();
        };

        window.saveItem = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = {
                scanCode: fd.get('scanCode').toUpperCase(),
                size: fd.get('size').toUpperCase(),
                gauge: fd.get('gauge'),
                material: fd.get('material').toUpperCase(),
                finish: fd.get('finish').toUpperCase(),
                color: fd.get('color').toUpperCase(),
                batch: fd.get('batch').toUpperCase(),
                weight: fd.get('weight'),
                location: fd.get('location').toUpperCase(),
                createdAt: Date.now(),
                user: window.state.user.name
            };
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'inventory'), data);
                showNotify("GUARDADO", true);
                window.setView('dashboard');
            } catch (err) { showNotify("ERROR AL GUARDAR"); }
        };

        window.html5QrCode = null;
        window.toggleScanner = async () => {
            if (window.state.isScanning) {
                stopScanner();
            } else {
                window.state.isScanning = true;
                render(); 
                setTimeout(async () => {
                    const readerElement = document.getElementById('reader');
                    if (!readerElement) return;
                    window.html5QrCode = new Html5Qrcode("reader");
                    try {
                        await window.html5QrCode.start(
                            { facingMode: "environment" },
                            { fps: 10, qrbox: { width: 250, height: 150 } },
                            (text) => {
                                // Forzamos el relleno del campo por ID y también por estado
                                const input = document.getElementById('fScanCode');
                                if (input) {
                                    input.value = text;
                                    input.dispatchEvent(new Event('input'));
                                }
                                showNotify("CAPTURADO", true);
                                stopScanner();
                            }
                        );
                    } catch (e) { 
                        showNotify("ERROR CÁMARA"); 
                        window.state.isScanning = false;
                        render();
                    }
                }, 200);
            }
        };

        const stopScanner = () => {
            if (window.html5QrCode) {
                window.html5QrCode.stop().then(() => {
                    window.html5QrCode = null;
                    window.state.isScanning = false;
                    render();
                }).catch(() => {
                    window.state.isScanning = false;
                    render();
                });
            } else {
                window.state.isScanning = false;
                render();
            }
        };

        window.searchInventory = () => {
            const f = window.state.searchFilters;
            const results = window.state.inventory.filter(i => {
                const matchSize = !f.size || (i.size || "").toLowerCase().includes(f.size.toLowerCase());
                const matchGauge = !f.gauge || (i.gauge || "").toString().includes(f.gauge);
                const matchColor = !f.color || (i.color || "").toLowerCase().includes(f.color.toLowerCase());
                const matchBatch = !f.batch || (i.batch || "").toLowerCase().includes(f.batch.toLowerCase());
                return matchSize && matchGauge && matchColor && matchBatch;
            });
            window.state.filteredResults = results;
            if (results.length === 0) showNotify("SIN COINCIDENCIAS");
            render();
        };

        window.openDetails = (item) => {
            window.state.selectedItem = item;
            const modal = document.getElementById('modal');
            modal.style.display = 'flex';
            modal.innerHTML = `
                <div class="card w-full max-w-sm relative animate-in fade-in zoom-in duration-200" onclick="event.stopPropagation()">
                    <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-300"><i data-lucide="x"></i></button>
                    <h2 class="text-xl font-black italic mb-4 uppercase text-slate-900 border-b pb-2">Ficha de Bobina</h2>
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Material</p><p class="font-black text-slate-800">${item.material || '---'}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">ID Bobina</p><p class="font-black text-slate-800">${item.scanCode || '---'}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Tamaño</p><p class="font-black text-slate-800">${item.size}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Galga</p><p class="font-black text-slate-800">${item.gauge}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Color</p><p class="font-black text-slate-800">${item.color || '---'}</p></div>
                            <div><p class="text-[9px] font-bold text-slate-400 uppercase">Acabado</p><p class="font-black text-slate-800">${item.finish || '---'}</p></div>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
                            <div class="grid grid-cols-2 gap-4">
                                <div><p class="text-[9px] font-bold text-slate-400 uppercase">Lote</p><p class="font-black text-green-600">${item.batch}</p></div>
                                <div><p class="text-[9px] font-bold text-slate-400 uppercase">Peso</p><p class="font-black text-green-600">${item.weight}</p></div>
                            </div>
                            <div class="mt-3"><p class="text-[9px] font-bold text-slate-400 uppercase">Ubicación</p><p class="font-black text-green-600 text-lg uppercase">Calle ${item.location}</p></div>
                        </div>
                        <div class="flex gap-2">
                             <button onclick="deleteItem('${item.id}'); closeModal();" class="flex-1 bg-red-50 text-red-500 font-bold py-3 rounded-xl uppercase text-[10px] flex items-center justify-center gap-2"><i data-lucide="trash-2" size="14"></i> Borrar Registro</button>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        };

        window.closeModal = (e) => {
            document.getElementById('modal').style.display = 'none';
        };

        window.deleteItem = async (id) => {
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inventory', id));
                showNotify("BORRADO", true);
            } catch (e) { showNotify("ERROR AL BORRAR"); }
        };

        window.deleteUser = async (id) => {
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'authorized_users', id));
                showNotify("ELIMINADO", true);
            } catch (e) { showNotify("ERROR AL BORRAR"); }
        };

        const render = () => {
            const root = document.getElementById('root');
            if (!window.state.user) {
                root.innerHTML = `
                <div class="h-screen flex flex-col items-center justify-center p-8 bg-slate-50">
                    <img src="https://i.postimg.cc/3rvnp3Rj/definitivo-logo.png" class="w-24 h-24 mb-6 rounded-3xl shadow-xl border-4 border-white">
                    <h1 class="text-3xl font-black italic mb-2 text-slate-900">STOCK CONTROL</h1>
                    <form onsubmit="doLogin(event)" class="w-full max-w-xs space-y-3">
                        <input id="lUser" class="input-box text-center uppercase" placeholder="USUARIO" required autocomplete="off">
                        <input id="lPin" type="password" class="input-box text-center" placeholder="PIN" required>
                        <button type="submit" class="btn-main mt-4">Entrar</button>
                    </form>
                </div>`;
            } else {
                root.innerHTML = `
                <div class="max-w-md mx-auto p-4 pb-32">
                    <header class="flex justify-between items-center mb-6">
                        <div>
                            <h2 class="text-2xl font-black italic uppercase tracking-tighter">
                                ${window.state.view === 'dashboard' ? 'INICIO' : 
                                  window.state.view === 'entrada' ? 'ENTRADA' : 
                                  window.state.view === 'buscar' ? 'BÚSQUEDA' : 'MAESTRO'}
                            </h2>
                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">HOLA, ${window.state.user.name}</p>
                        </div>
                        <button onclick="logout()" class="p-3 text-slate-300"><i data-lucide="log-out"></i></button>
                    </header>
                    ${renderContent()}
                    <nav class="nav-bar">
                        <button onclick="setView('dashboard')" class="${window.state.view === 'dashboard' ? 'text-green-600' : 'text-slate-300'}"><i data-lucide="layout-grid"></i></button>
                        <button onclick="setView('entrada')" class="plus-btn"><i data-lucide="plus" size="32"></i></button>
                        <button onclick="setView('buscar')" class="${window.state.view === 'buscar' ? 'text-green-600' : 'text-slate-300'}"><i data-lucide="search"></i></button>
                    </nav>
                </div>`;
            }
            if(window.lucide) lucide.createIcons();
        };

        const renderContent = () => {
            if (window.state.view === 'dashboard') {
                const totalKg = window.state.inventory.reduce((a, b) => a + (parseFloat(b.weight) || 0), 0);
                return `
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="card"><p class="text-4xl font-black text-slate-800">${window.state.inventory.length}</p><p class="text-[10px] font-bold text-slate-400 uppercase mt-1">Bobinas</p></div>
                    <div class="card bg-slate-900 text-white"><p class="text-2xl font-black text-green-400">${totalKg.toLocaleString()}</p><p class="text-[10px] font-bold text-slate-500 uppercase mt-1">Peso Total</p></div>
                </div>
                ${window.state.user.role === 'admin' ? `
                <div onclick="setView('maestro')" class="card bg-indigo-600 text-white mb-6 flex justify-between items-center cursor-pointer p-5">
                    <div><p class="font-black italic text-lg uppercase">Personal</p><p class="text-[9px] font-bold opacity-70 uppercase tracking-widest">Gestión de Acceso</p></div>
                    <i data-lucide="shield-check"></i>
                </div>` : ''}
                <div class="card">
                    <h3 class="section-title">Movimientos Recientes</h3>
                    <div class="space-y-4">
                        ${window.state.inventory.slice(0,5).map(i => `
                            <div onclick='openDetails(${JSON.stringify(i)})' class="flex justify-between items-center border-b border-slate-50 pb-2 cursor-pointer active:opacity-50">
                                <div><p class="text-xs font-black uppercase text-slate-700">${i.material} ${i.size}</p><p class="text-[9px] text-slate-400 uppercase font-bold italic">LOTE: ${i.batch}</p></div>
                                <div class="text-right"><p class="text-xs font-black">${i.weight}</p><p class="text-[9px] text-green-500 font-bold uppercase">Calle ${i.location}</p></div>
                            </div>
                        `).join('') || '<p class="text-center text-slate-300 text-xs py-4 italic">Sin registros</p>'}
                    </div>
                </div>`;
            }
            if (window.state.view === 'entrada') {
                return `
                <form onsubmit="saveItem(event)" class="card space-y-4">
                    <div class="flex flex-col items-center pt-2">
                        ${window.state.isScanning ? '<div id="reader"></div>' : ''}
                        <button type="button" onclick="toggleScanner()" class="w-14 h-14 ${window.state.isScanning ? 'bg-red-500' : 'bg-green-500'} text-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-transform">
                            <i data-lucide="${window.state.isScanning ? 'x' : 'scan'}" size="28"></i>
                        </button>
                        <p class="text-[10px] font-black text-slate-400 mt-2 uppercase tracking-widest italic">${window.state.isScanning ? 'Cerrar Cámara' : 'Escanear Código'}</p>
                    </div>
                    
                    <div class="space-y-1">
                        <label class="text-[9px] font-black text-slate-400 ml-2 uppercase italic">ID Bobina</label>
                        <input id="fScanCode" name="scanCode" class="input-box uppercase border-dashed bg-slate-50" required>
                    </div>

                    <div class="pt-2">
                        <p class="section-title">Datos de Ficha</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">Tamaño</label><input name="size" class="input-box uppercase"></div>
                            <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">Galga</label><input name="gauge" type="number" class="input-box"></div>
                            <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">Material</label><input name="material" class="input-box uppercase"></div>
                            <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">Acabado</label><input name="finish" class="input-box uppercase"></div>
                            <div class="col-span-2 space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase">Color</label><input name="color" class="input-box uppercase"></div>
                        </div>
                    </div>
                    
                    <div class="pt-2">
                        <p class="section-title">Datos de Registro</p>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase italic">Nº Lote</label><input name="batch" class="input-box uppercase border-green-100" required></div>
                            <div class="space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase italic">Peso</label><input name="weight" type="number" step="0.01" class="input-box border-green-100" required></div>
                            <div class="col-span-2 space-y-1"><label class="text-[9px] font-bold text-slate-400 ml-2 uppercase italic text-green-600">Calle</label><input name="location" class="input-box uppercase text-green-600 border-green-200" required></div>
                        </div>
                    </div>
                    <button type="submit" class="btn-main mt-4">Confirmar Registro</button>
                </form>`;
            }
            if (window.state.view === 'buscar') {
                const results = window.state.filteredResults;
                return `
                <div class="space-y-4">
                    <div class="card space-y-3">
                        <h3 class="section-title">Filtros de Búsqueda</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <input class="input-box uppercase" placeholder="Tamaño" value="${window.state.searchFilters.size}" oninput="window.state.searchFilters.size=this.value">
                            <input class="input-box uppercase" placeholder="Galga" value="${window.state.searchFilters.gauge}" oninput="window.state.searchFilters.gauge=this.value">
                            <input class="input-box uppercase" placeholder="Color" value="${window.state.searchFilters.color}" oninput="window.state.searchFilters.color=this.value">
                            <input class="input-box uppercase" placeholder="Nº Lote" value="${window.state.searchFilters.batch}" oninput="window.state.searchFilters.batch=this.value">
                        </div>
                        <button onclick="searchInventory()" class="btn-green mt-2 flex items-center justify-center gap-2"><i data-lucide="search" size="18"></i> Buscar</button>
                    </div>

                    <div class="space-y-2">
                        ${results ? (results.length > 0 ? results.map(i => `
                            <div onclick='openDetails(${JSON.stringify(i)})' class="card flex justify-between items-center py-4 p-5 cursor-pointer active:scale-[0.98] transition-transform">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 bg-slate-50 rounded-lg flex items-center justify-center font-black text-green-600 text-xs border border-slate-100">${i.location}</div>
                                    <div>
                                        <p class="font-black text-slate-800 text-xs uppercase">${i.material} ${i.size}</p>
                                        <p class="text-[9px] text-slate-400 font-bold uppercase italic">LOTE: ${i.batch} • ${i.weight}</p>
                                    </div>
                                </div>
                                <i data-lucide="chevron-right" class="text-slate-200"></i>
                            </div>
                        `).join('') : '<div class="card p-10 text-center text-slate-300 font-bold uppercase text-xs tracking-widest italic">Sin coincidencias</div>') : ''}
                    </div>
                </div>`;
            }
            if (window.state.view === 'maestro') {
                return `
                <div class="space-y-6">
                    <div class="card">
                        <h3 class="section-title text-center border-none">Nuevo Trabajador</h3>
                        <div class="flex gap-2">
                            <input id="newUserName" class="input-box uppercase" placeholder="NOMBRE">
                            <button onclick="addUser()" class="bg-indigo-600 text-white p-4 rounded-xl shadow-lg active:scale-90 transition-transform"><i data-lucide="user-plus"></i></button>
                        </div>
                    </div>
                    <div class="card">
                        <h3 class="section-title text-center border-none">Usuarios Activos</h3>
                        <div class="space-y-2">
                            ${window.state.users.map(u => `
                                <div class="flex justify-between items-center p-4 bg-slate-50 rounded-xl border border-slate-100">
                                    <span class="font-black text-xs uppercase text-slate-700">${u.name}</span>
                                    <button onclick="deleteUser('${u.id}')" class="text-slate-300 hover:text-red-500 transition-colors"><i data-lucide="trash-2" size="18"></i></button>
                                </div>`).join('')}
                        </div>
                    </div>
                </div>`;
            }
            return '';
        };

        window.onload = async () => {
            await signInAnonymously(auth);
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'inventory'), (snap) => {
                window.state.inventory = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.createdAt - a.createdAt);
                render();
            });
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'authorized_users'), (snap) => {
                window.state.users = snap.docs.map(d => ({id: d.id, ...d.data()}));
                render();
            });
            render();
        };

        window.logout = () => {
            localStorage.removeItem('embasana_session');
            window.state.user = null;
            window.state.view = 'login';
            render();
        };

        window.addUser = async () => {
            const name = document.getElementById('newUserName').value.trim().toUpperCase();
            if(!name) return;
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'authorized_users'), { name });
            document.getElementById('newUserName').value = '';
            showNotify("REGISTRADO", true);
        };
    </script>
</body>
</html>
