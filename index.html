<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmbasanaStock Pro</title>
    <!-- Tailwind CSS para estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel para transformar JSX en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase SDKs (Modo compatibilidad para facilidad en HTML) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- CONFIGURACIÓN DE FIREBASE ---
        // Se detectan las variables del entorno del sistema o se usan strings vacíos para evitar errores
        const firebaseConfig = window.__firebase_config ? JSON.parse(window.__firebase_config) : {};
        const appId = window.__app_id || 'embasana-stock-prod';

        // Inicializar Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Componente de Icono para Lucide
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [inventory, setInventory] = useState([]);
            const [authorizedUsers, setAuthorizedUsers] = useState([]);
            const [searchQuery, setSearchQuery] = useState('');
            const [searchMode, setSearchMode] = useState('todo');
            const [notification, setNotification] = useState(null);
            const [loading, setLoading] = useState(true);

            // Gestión de Autenticación
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (window.__initial_auth_token) {
                            await auth.signInWithCustomToken(window.__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }
                    } catch (err) {
                        console.error("Error Auth:", err);
                    }
                };
                initAuth();

                const unsubscribe = auth.onAuthStateChanged((firebaseUser) => {
                    if (firebaseUser) {
                        const savedSession = localStorage.getItem('embasana_session_v2');
                        if (savedSession) {
                            setUser(JSON.parse(savedSession));
                            setView('dashboard');
                        }
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Escucha de datos en tiempo real
            useEffect(() => {
                if (!auth.currentUser) return;

                const unsubInv = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory')
                    .onSnapshot((snap) => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setInventory(data.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)));
                    });

                const unsubUsers = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('authorized_users')
                    .onSnapshot((snap) => {
                        const data = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                        setAuthorizedUsers(data.sort((a, b) => (a.name || "").localeCompare(b.name || "")));
                    });

                return () => { unsubInv(); unsubUsers(); };
            }, [loading]);

            const showNotify = (text, type = 'error') => {
                setNotification({ text, type });
                setTimeout(() => setNotification(null), 3000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const uName = e.target.username.value.trim().toLowerCase();
                const pin = e.target.pin.value;

                if (uName === 'admin' && pin === 'master2024') {
                    const data = { name: 'ADMIN', role: 'admin' };
                    setUser(data);
                    localStorage.setItem('embasana_session_v2', JSON.stringify(data));
                    setView('dashboard');
                } else {
                    const found = authorizedUsers.find(u => u.name.toLowerCase() === uName);
                    if (found && pin === '1234') {
                        const data = { name: found.name, role: 'operario' };
                        setUser(data);
                        localStorage.setItem('embasana_session_v2', JSON.stringify(data));
                        setView('dashboard');
                    } else {
                        showNotify("ACCESO DENEGADO");
                    }
                }
            };

            const logout = () => {
                localStorage.removeItem('embasana_session_v2');
                setUser(null);
                setView('login');
            };

            const saveEntry = async (e) => {
                e.preventDefault();
                const form = e.target;
                const data = {
                    size: form.size.value.toUpperCase(),
                    material: form.material.value.toUpperCase(),
                    location: form.location.value.toUpperCase(),
                    weight: parseFloat(form.weight.value) || 0,
                    batch: form.batch.value.toUpperCase(),
                    gauge: form.gauge.value,
                    createdAt: Date.now(),
                    createdBy: user.name
                };
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory').add(data);
                    showNotify("GUARDADO", "success");
                    setView('dashboard');
                } catch (err) { showNotify("ERROR AL GUARDAR"); }
            };

            if (loading) return <div className="h-screen flex items-center justify-center font-bold">CARGANDO...</div>;

            if (view === 'login') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-8 text-center">
                        <div className="w-32 h-32 bg-white rounded-full flex items-center justify-center shadow-xl mb-8 border-4 border-white overflow-hidden">
                            <img src="https://i.postimg.cc/3rvnp3Rj/definitivo-logo.png" className="w-full h-full object-cover" />
                        </div>
                        <h1 className="text-slate-800 text-3xl font-black uppercase mb-10 italic">STOCK CONTROL</h1>
                        <form onSubmit={handleLogin} className="w-full max-w-xs space-y-3">
                            <input name="username" required className="w-full bg-white border border-slate-200 p-4 rounded-2xl outline-none font-bold text-center uppercase" placeholder="Usuario" />
                            <input name="pin" type="password" required className="w-full bg-white border border-slate-200 p-4 rounded-2xl outline-none font-bold text-center" placeholder="PIN" />
                            <button type="submit" className="w-full bg-slate-900 text-white p-5 rounded-2xl font-black italic uppercase shadow-xl">Entrar</button>
                        </form>
                        {notification && <div className="mt-4 text-red-500 font-bold uppercase text-xs">{notification.text}</div>}
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32 max-w-md mx-auto p-6">
                    <header className="flex justify-between items-center mb-8">
                        <div>
                            <h1 className="text-2xl font-black italic uppercase">{view === 'dashboard' ? 'INICIO' : view === 'entry' ? 'REGISTRO' : 'BUSCAR'}</h1>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Hola, {user.name}</p>
                        </div>
                        <button onClick={logout} className="bg-white p-3 rounded-xl text-slate-300 shadow-sm"><Icon name="log-out" size={20}/></button>
                    </header>

                    {view === 'dashboard' && (
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100 text-center">
                                    <p className="text-4xl font-black">{inventory.length}</p>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase">Bobinas</p>
                                </div>
                                <div className="bg-slate-900 p-6 rounded-[2.5rem] text-white shadow-xl text-center">
                                    <p className="text-2xl font-black text-green-400">{inventory.reduce((a,b) => a + Number(b.weight), 0).toLocaleString()} <span className="text-xs">kg</span></p>
                                    <p className="text-[10px] font-bold text-slate-500 uppercase">Total</p>
                                </div>
                            </div>
                            <div className="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100">
                                <h3 className="text-[10px] font-black text-slate-300 uppercase italic mb-4">Últimos Movimientos</h3>
                                {inventory.slice(0, 5).map(item => (
                                    <div key={item.id} className="flex justify-between border-b border-slate-50 py-3 last:border-0">
                                        <span className="text-xs font-bold uppercase">{item.material} {item.size}</span>
                                        <span className="text-xs font-black text-green-600">CALLE {item.location}</span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {view === 'entry' && (
                        <form onSubmit={saveEntry} className="bg-white rounded-[2.5rem] p-6 shadow-sm space-y-4">
                            <input name="size" placeholder="TAMAÑO (mm)" required className="w-full bg-slate-50 p-4 rounded-xl font-bold uppercase outline-none" />
                            <input name="gauge" placeholder="GALGA" required type="number" className="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" />
                            <input name="material" placeholder="MATERIAL" required className="w-full bg-slate-50 p-4 rounded-xl font-bold uppercase outline-none" />
                            <input name="batch" placeholder="LOTE" required className="w-full bg-slate-50 p-4 rounded-xl font-bold uppercase outline-none" />
                            <input name="weight" placeholder="PESO (kg)" required type="number" step="0.01" className="w-full bg-slate-50 p-4 rounded-xl font-bold outline-none" />
                            <input name="location" placeholder="CALLE" required className="w-full bg-slate-50 p-4 rounded-xl font-bold uppercase outline-none text-green-600" />
                            <button type="submit" className="w-full bg-slate-900 text-white p-5 rounded-2xl font-black uppercase">Confirmar</button>
                        </form>
                    )}

                    {view === 'search' && (
                        <div className="space-y-4">
                            <input onChange={e => setSearchQuery(e.target.value)} className="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-100 font-bold uppercase" placeholder="Buscar..." />
                            {inventory.filter(i => (i.batch + i.material).toUpperCase().includes(searchQuery.toUpperCase())).map(i => (
                                <div key={i.id} className="bg-white p-4 rounded-2xl flex justify-between items-center shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <div className="w-8 h-8 rounded-lg bg-green-50 flex items-center justify-center font-bold text-xs text-green-600">{i.location}</div>
                                        <div>
                                            <p className="font-black text-xs uppercase">{i.material} {i.size}</p>
                                            <p className="text-[9px] font-bold text-slate-400 uppercase">{i.batch}</p>
                                        </div>
                                    </div>
                                    <button onClick={async () => { if(confirm("¿BORRAR?")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory').doc(i.id).delete(); }} className="text-slate-200 hover:text-red-500"><Icon name="trash-2" size={18}/></button>
                                </div>
                            ))}
                        </div>
                    )}

                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px]">
                        <div className="bg-white h-20 rounded-full shadow-2xl border border-slate-100 flex justify-around items-center px-6">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-indigo-600' : 'text-slate-300'}><Icon name="layout-grid" /></button>
                            <button onClick={() => setView('entry')} className="bg-green-500 w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg -mt-10 border-4 border-slate-50"><Icon name="plus" size={28}/></button>
                            <button onClick={() => setView('search')} className={view === 'search' ? 'text-indigo-600' : 'text-slate-300'}><Icon name="search" /></button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
