<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EmbasanaStock Pro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        #root:empty::before {
            content: "Cargando aplicación...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-weight: 900;
            color: #94a3b8;
            text-transform: uppercase;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <!-- Carga de Librerías al final para evitar bloqueo de renderizado -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- COMPONENTE DE ICONO ---
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- APP PRINCIPAL ---
        function App() {
            const [user, setUser] = useState(null);
            const [view, setView] = useState('login');
            const [inventory, setInventory] = useState([]);
            const [loading, setLoading] = useState(true);
            const [notification, setNotification] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');

            // Cargar datos (LocalStorage para máxima compatibilidad Vercel/GitHub)
            useEffect(() => {
                try {
                    const savedInv = localStorage.getItem('embasana_inventory_v3');
                    if (savedInv) setInventory(JSON.parse(savedInv));

                    const savedSession = localStorage.getItem('embasana_session_v3');
                    if (savedSession) {
                        setUser(JSON.parse(savedSession));
                        setView('dashboard');
                    }
                } catch (e) {
                    console.error("Error inicializando:", e);
                } finally {
                    setLoading(false);
                }
            }, []);

            // Guardar cambios persistentes
            useEffect(() => {
                if (!loading) {
                    localStorage.setItem('embasana_inventory_v3', JSON.stringify(inventory));
                }
            }, [inventory, loading]);

            const showNotify = (text) => {
                setNotification(text);
                setTimeout(() => setNotification(null), 3000);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                const uName = e.target.username.value.trim().toUpperCase();
                const pin = e.target.pin.value;

                // Usuarios definidos
                const validUsers = {
                    'ADMIN': 'master2024',
                    'JUAN': '1234'
                };

                if (validUsers[uName] === pin) {
                    const userData = { name: uName, role: uName === 'ADMIN' ? 'admin' : 'operario' };
                    setUser(userData);
                    localStorage.setItem('embasana_session_v3', JSON.stringify(userData));
                    setView('dashboard');
                } else {
                    showNotify("ACCESO DENEGADO");
                }
            };

            const logout = () => {
                localStorage.removeItem('embasana_session_v3');
                setUser(null);
                setView('login');
            };

            const saveEntry = (e) => {
                e.preventDefault();
                const form = e.target;
                const newItem = {
                    id: 'ID' + Date.now(),
                    size: form.size.value,
                    material: form.material.value.toUpperCase(),
                    location: form.location.value.toUpperCase(),
                    weight: form.weight.value,
                    batch: form.batch.value.toUpperCase(),
                    gauge: form.gauge.value,
                    createdAt: Date.now()
                };
                setInventory([newItem, ...inventory]);
                showNotify("REGISTRO GUARDADO");
                setView('dashboard');
            };

            const deleteItem = (id) => {
                if(window.confirm("¿BORRAR ESTA BOBINA?")) {
                    setInventory(prev => prev.filter(i => i.id !== id));
                }
            };

            // Filtro de búsqueda optimizado
            const filteredInventory = useMemo(() => {
                const q = searchQuery.toUpperCase();
                return inventory.filter(i => 
                    i.batch.includes(q) || 
                    i.material.includes(q) || 
                    i.size.includes(q) ||
                    i.location.includes(q)
                );
            }, [inventory, searchQuery]);

            if (loading) return null; // El CSS se encarga del mensaje de carga inicial

            if (view === 'login') {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-8 bg-slate-50">
                        <div className="w-24 h-24 bg-white rounded-3xl flex items-center justify-center shadow-xl mb-6 border border-slate-100 overflow-hidden">
                            <img src="https://i.postimg.cc/3rvnp3Rj/definitivo-logo.png" className="w-full h-full object-cover" alt="Logo" />
                        </div>
                        <h1 className="text-2xl font-black italic uppercase mb-8 tracking-tighter text-slate-800">EMBASANA STOCK</h1>
                        <form onSubmit={handleLogin} className="w-full max-w-xs space-y-3">
                            <input name="username" required autoComplete="off" className="w-full bg-white border border-slate-200 p-4 rounded-2xl outline-none font-bold text-center uppercase focus:border-indigo-500 transition-all" placeholder="Usuario" />
                            <input name="pin" type="password" required className="w-full bg-white border border-slate-200 p-4 rounded-2xl outline-none font-bold text-center focus:border-indigo-500 transition-all" placeholder="PIN" />
                            <button type="submit" className="w-full bg-slate-900 text-white p-5 rounded-2xl font-black italic uppercase shadow-lg active:scale-95 transition-transform">Entrar</button>
                        </form>
                        {notification && <div className="mt-4 text-red-500 font-black text-xs uppercase">{notification}</div>}
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-32 max-w-md mx-auto p-6 bg-slate-50">
                    <header className="flex justify-between items-center mb-8">
                        <div>
                            <h1 className="text-2xl font-black italic uppercase leading-none tracking-tighter">
                                {view === 'dashboard' ? 'INICIO' : view === 'entry' ? 'REGISTRO' : 'BUSCAR'}
                            </h1>
                            <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">HOLA, {user.name}</p>
                        </div>
                        <button onClick={logout} className="bg-white p-3 rounded-xl text-slate-300 shadow-sm border border-slate-100 active:bg-red-50 active:text-red-400">
                            <Icon name="log-out" size={20}/>
                        </button>
                    </header>

                    {view === 'dashboard' && (
                        <div className="space-y-4">
                            <div className="grid grid-cols-2 gap-4">
                                <div className="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-100 text-center">
                                    <p className="text-4xl font-black text-slate-800">{inventory.length}</p>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Bobinas</p>
                                </div>
                                <div className="bg-slate-900 p-6 rounded-[2rem] text-white shadow-xl text-center">
                                    <p className="text-2xl font-black text-green-400">{inventory.reduce((a,b) => a + Number(b.weight || 0), 0).toLocaleString()} <span className="text-xs">kg</span></p>
                                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Stock Total</p>
                                </div>
                            </div>
                            <div className="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-100">
                                <h3 className="text-[10px] font-black text-slate-300 uppercase italic mb-4 tracking-widest">Últimos Movimientos</h3>
                                {inventory.length === 0 ? (
                                    <p className="text-center py-4 text-xs font-bold text-slate-300 uppercase italic">Sin datos registrados</p>
                                ) : (
                                    inventory.slice(0, 4).map(item => (
                                        <div key={item.id} className="flex justify-between border-b border-slate-50 py-3 last:border-0">
                                            <span className="text-xs font-bold uppercase text-slate-600">{item.material} {item.size}mm</span>
                                            <span className="text-xs font-black text-green-600 uppercase tracking-tighter">CALLE {item.location}</span>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {view === 'entry' && (
                        <form onSubmit={saveEntry} className="bg-white rounded-[2.5rem] p-6 shadow-sm border border-slate-100 space-y-3">
                            <div className="space-y-1">
                                <label className="text-[9px] font-black text-slate-400 uppercase ml-2 italic">Especificaciones</label>
                                <input name="material" placeholder="MATERIAL (PE, PP...)" required className="w-full bg-slate-50 p-4 rounded-2xl font-bold uppercase outline-none focus:bg-white focus:ring-2 ring-indigo-100 transition-all" />
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="size" placeholder="ANCHO (mm)" type="number" required className="w-full bg-slate-50 p-4 rounded-2xl font-bold outline-none focus:bg-white focus:ring-2 ring-indigo-100 transition-all" />
                                    <input name="gauge" placeholder="GALGA" type="number" required className="w-full bg-slate-50 p-4 rounded-2xl font-bold outline-none focus:bg-white focus:ring-2 ring-indigo-100 transition-all" />
                                </div>
                            </div>
                            <div className="space-y-1">
                                <label className="text-[9px] font-black text-slate-400 uppercase ml-2 italic">Logística</label>
                                <input name="batch" placeholder="Nº DE LOTE" required className="w-full bg-slate-50 p-4 rounded-2xl font-bold uppercase outline-none focus:bg-white focus:ring-2 ring-indigo-100 transition-all" />
                                <div className="grid grid-cols-2 gap-3">
                                    <input name="weight" placeholder="PESO (kg)" type="number" step="0.1" required className="w-full bg-slate-50 p-4 rounded-2xl font-bold outline-none focus:bg-white focus:ring-2 ring-indigo-100 transition-all" />
                                    <input name="location" placeholder="CALLE" required className="w-full bg-slate-50 p-4 rounded-2xl font-black uppercase text-green-600 outline-none focus:bg-white focus:ring-2 ring-green-100 transition-all" />
                                </div>
                            </div>
                            <button type="submit" className="w-full bg-slate-900 text-white p-5 rounded-3xl font-black uppercase italic shadow-xl mt-4 active:scale-95 transition-all">Registrar Bobina</button>
                        </form>
                    )}

                    {view === 'search' && (
                        <div className="space-y-4">
                            <div className="relative">
                                <input onChange={e => setSearchQuery(e.target.value)} className="w-full bg-white p-5 rounded-[2rem] shadow-sm border border-slate-100 font-bold uppercase outline-none focus:ring-2 ring-indigo-100 pl-14" placeholder="Lote, material, calle..." />
                                <div className="absolute left-6 top-1/2 -translate-y-1/2 text-slate-300"><Icon name="search" size={20} /></div>
                            </div>
                            <div className="space-y-3">
                                {filteredInventory.length === 0 ? (
                                    <p className="text-center py-8 text-xs font-bold text-slate-300 uppercase">No hay resultados</p>
                                ) : (
                                    filteredInventory.map(i => (
                                        <div key={i.id} className="bg-white p-4 rounded-[1.5rem] flex justify-between items-center shadow-sm border border-slate-100">
                                            <div className="flex items-center gap-4">
                                                <div className="w-10 h-10 rounded-xl bg-green-50 flex items-center justify-center font-black text-xs text-green-600 border border-green-100">{i.location}</div>
                                                <div>
                                                    <p className="font-black text-[13px] uppercase leading-none">{i.material} {i.size}x{i.gauge}</p>
                                                    <p className="text-[10px] font-bold text-slate-400 uppercase mt-1 italic">Lote: {i.batch} • {i.weight}kg</p>
                                                </div>
                                            </div>
                                            <button onClick={() => deleteItem(i.id)} className="w-10 h-10 flex items-center justify-center text-slate-200 hover:text-red-500 active:bg-red-50 rounded-full transition-colors"><Icon name="trash-2" size={18}/></button>
                                        </div>
                                    ))
                                )}
                            </div>
                        </div>
                    )}

                    {notification && (
                        <div className="fixed top-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-6 py-3 rounded-full font-black text-[10px] uppercase tracking-widest shadow-2xl z-50 animate-bounce">
                            {notification}
                        </div>
                    )}

                    <nav className="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-[400px] z-40">
                        <div className="bg-white/90 backdrop-blur-xl h-20 rounded-[2.5rem] shadow-2xl border border-white/50 flex justify-around items-center px-6">
                            <button onClick={() => setView('dashboard')} className={view === 'dashboard' ? 'text-indigo-600 scale-110' : 'text-slate-300'}>
                                <Icon name="layout-grid" size={26} />
                            </button>
                            <button onClick={() => setView('entry')} className="bg-slate-900 w-16 h-16 rounded-[2rem] flex items-center justify-center text-white shadow-xl -mt-12 border-4 border-slate-50 active:scale-90 transition-all">
                                <Icon name="plus" size={30}/>
                            </button>
                            <button onClick={() => setView('search')} className={view === 'search' ? 'text-indigo-600 scale-110' : 'text-slate-300'}>
                                <Icon name="search" size={26} />
                            </button>
                        </div>
                    </nav>
                </div>
            );
        }

        // Renderizado con comprobación de seguridad
        try {
            const container = document.getElementById('root');
            const root = ReactDOM.createRoot(container);
            root.render(<App />);
        } catch (e) {
            document.body.innerHTML = `<div style="padding:20px; font-family:sans-serif;">Error al cargar React: ${e.message}</div>`;
        }
    </script>
</body>
</html>
