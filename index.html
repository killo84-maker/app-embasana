<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STOCK CONTROL - Embasana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        .input-box {
            width: 100%;
            background-color: #f8fafc;
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            outline: none;
            font-weight: 700;
            font-size: 1rem;
        }

        .tab-bar-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            z-index: 100;
        }

        .tab-bar {
            background: white;
            border-radius: 50px;
            height: 70px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 0 20px;
        }

        .btn-plus-center {
            width: 70px;
            height: 70px;
            background: #22c55e; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 5px solid #f1f5f9;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
        }

        .nav-item { color: #cbd5e1; }
        .nav-item.active { color: #22c55e; } 

        #reader {
            width: 100%;
            border-radius: 1.5rem;
            overflow: hidden;
            display: none;
            border: 4px solid #22c55e;
            background: #000;
        }

        .card-main {
            background: white;
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>

    <div id="notification" class="fixed top-5 left-1/2 -translate-x-1/2 z-[1000] px-6 py-3 rounded-xl font-bold text-white text-xs uppercase hidden shadow-lg"></div>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, onSnapshot, doc, query } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByMJBcH3pdeybyyDEEukdGZjB7vxmH4jA",
            authDomain: "embasana-stock-1a7b9.firebaseapp.com",
            projectId: "embasana-stock-1a7b9",
            storageBucket: "embasana-stock-1a7b9.firebasestorage.app",
            appId: "1:5607146974:web:1f9fc894fc31e56ab8894f"
        };

        const fbApp = initializeApp(firebaseConfig);
        const db = getFirestore(fbApp);
        const auth = getAuth(fbApp);
        const appId = 'embasana-stock-prod';

        window.state = {
            view: localStorage.getItem('embasana_user') ? 'dashboard' : 'login',
            user: JSON.parse(localStorage.getItem('embasana_user')) || null,
            inventory: [],
            isScanning: false,
            flashOn: false,
            tempFormData: { scanCode: '', size: '', gauge: '', material: '' }
        };

        window.showNotify = (msg, isSuccess = false) => {
            const el = document.getElementById('notification');
            el.innerText = msg;
            el.style.backgroundColor = isSuccess ? '#22c55e' : '#ef4444';
            el.classList.remove('hidden');
            setTimeout(() => el.classList.add('hidden'), 3000);
        };

        window.render = () => {
            const root = document.getElementById('app');
            if (window.state.view === 'login') {
                root.innerHTML = `
                    <div class="h-screen flex flex-col items-center justify-center p-8 bg-slate-50">
                        <h1 class="text-3xl font-black mb-8 uppercase tracking-tighter text-slate-900">EMBASANA STOCK</h1>
                        <div class="w-full max-w-xs space-y-4">
                            <input id="lUser" class="input-box uppercase" placeholder="USUARIO">
                            <input id="lPass" type="password" class="input-box" placeholder="PIN">
                            <button onclick="doLogin()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold uppercase">Entrar</button>
                        </div>
                    </div>
                `;
            } else {
                root.innerHTML = `
                    <div class="max-w-md mx-auto p-6 pb-32">
                        <header class="flex justify-between items-center mb-8">
                            <h2 class="text-xl font-black uppercase italic">${window.state.view}</h2>
                            <button onclick="logout()" class="text-slate-300"><i data-lucide="log-out"></i></button>
                        </header>
                        <div id="content">${renderView()}</div>
                        <div class="tab-bar-container">
                            <div class="tab-bar">
                                <button onclick="setView('dashboard')" class="nav-item ${window.state.view==='dashboard'?'active':''}"><i data-lucide="layout-grid"></i></button>
                                <button onclick="setView('entry')" class="btn-plus-center"><i data-lucide="plus" size="30"></i></button>
                                <button onclick="setView('search')" class="nav-item ${window.state.view==='search'?'active':''}"><i data-lucide="search"></i></button>
                            </div>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        };

        const renderView = () => {
            if (window.state.view === 'dashboard') {
                return `<div class="card-main">
                    <p class="text-xs font-bold text-slate-400 uppercase mb-2">Total Bobinas</p>
                    <p class="text-5xl font-black">${window.state.inventory.length}</p>
                </div>`;
            }
            if (window.state.view === 'entry') {
                return `
                    <div class="space-y-4">
                        <div id="reader"></div>
                        <div class="flex justify-center gap-4">
                            <button onclick="startScan()" class="bg-green-500 text-white p-4 rounded-full shadow-lg"><i data-lucide="scan"></i></button>
                            ${window.state.isScanning ? `<button onclick="toggleFlash()" class="bg-amber-500 text-white p-4 rounded-full"><i data-lucide="zap"></i></button>` : ''}
                        </div>
                        <input id="fCode" class="input-box uppercase" placeholder="CÓDIGO" value="${window.state.tempFormData.scanCode}">
                        <div class="grid grid-cols-2 gap-4">
                            <input id="fSize" class="input-box uppercase" placeholder="TAMAÑO" value="${window.state.tempFormData.size}">
                            <input id="fGauge" class="input-box" placeholder="GALGA" value="${window.state.tempFormData.gauge}">
                        </div>
                        <input id="fBatch" class="input-box uppercase" placeholder="LOTE">
                        <input id="fWeight" type="number" class="input-box" placeholder="PESO KG">
                        <input id="fLoc" class="input-box uppercase" placeholder="CALLE">
                        <button onclick="saveData()" class="w-full bg-slate-900 text-white p-4 rounded-xl font-bold uppercase">Guardar Registro</button>
                    </div>
                `;
            }
            return `<div class="space-y-4">
                <input oninput="search(this.value)" class="input-box" placeholder="Buscar por lote o código...">
                <div id="list" class="space-y-3"></div>
            </div>`;
        };

        window.doLogin = () => {
            const u = document.getElementById('lUser').value.toLowerCase();
            const p = document.getElementById('lPass').value;
            if(u === 'admin' && p === 'master2024') {
                window.state.user = { name: 'Admin' };
                localStorage.setItem('embasana_user', JSON.stringify(window.state.user));
                window.state.view = 'dashboard';
                render();
            } else { showNotify("Credenciales incorrectas"); }
        };

        window.logout = () => { localStorage.removeItem('embasana_user'); window.state.view = 'login'; render(); };
        window.setView = (v) => { window.state.view = v; render(); };

        let html5QrCode;
        window.startScan = () => {
            const r = document.getElementById('reader');
            r.style.display = 'block';
            window.state.isScanning = true;
            render();
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: {width: 250, height: 150} }, (text) => {
                const found = window.state.inventory.find(i => i.scanCode === text);
                window.state.tempFormData = { scanCode: text, size: found?.size||'', gauge: found?.gauge||'', material: found?.material||'' };
                stopScan();
            }, () => {});
        };

        const stopScan = () => {
            if(html5QrCode) html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display='none';
                window.state.isScanning = false;
                render();
            });
        };

        window.saveData = async () => {
            const payload = {
                scanCode: document.getElementById('fCode').value.toUpperCase(),
                size: document.getElementById('fSize').value.toUpperCase(),
                gauge: document.getElementById('fGauge').value,
                batch: document.getElementById('fBatch').value.toUpperCase(),
                weight: document.getElementById('fWeight').value,
                location: document.getElementById('fLoc').value.toUpperCase(),
                createdAt: Date.now()
            };
            if(!payload.batch || !payload.location) return showNotify("Faltan datos");
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'inventory'), payload);
            showNotify("Guardado con éxito", true);
            window.state.view = 'dashboard';
            render();
        };

        window.onload = async () => {
            await signInAnonymously(auth);
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'inventory'), (snap) => {
                window.state.inventory = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.createdAt - a.createdAt);
                render();
            });
        };
    </script>
</body>
</html>
