<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>STOCK CONTROL - Embasana</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,700;0,900;1,900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; 
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }

        .input-box {
            width: 100%;
            background-color: #f8fafc;
            border-radius: 1rem;
            padding: 1rem;
            border: 1px solid #e2e8f0;
            outline: none;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .input-box:focus {
            border-color: #22c55e;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
        }

        .label-text {
            font-size: 0.65rem;
            font-weight: 800;
            color: #94a3b8;
            margin-bottom: 0.4rem;
            margin-left: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tab-bar-container {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            z-index: 100;
        }

        .tab-bar {
            background: white;
            border-radius: 50px;
            height: 70px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            padding: 0 20px;
        }

        .btn-plus-center {
            width: 75px;
            height: 75px;
            background: #22c55e; 
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            border: 6px solid #f1f5f9;
            margin-bottom: 35px;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-plus-center:active { transform: scale(0.9); }

        .nav-item { color: #cbd5e1; cursor: pointer; }
        .nav-item.active { color: #22c55e; } 

        .btn-confirm {
            background-color: #0f172a;
            color: white;
            width: 100%;
            padding: 1.4rem;
            border-radius: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: 1px;
            margin-top: 1.5rem;
            box-shadow: 0 10px 15px -3px rgba(15, 23, 42, 0.3);
        }

        .card-main {
            background: white;
            border-radius: 2.5rem;
            padding: 2.5rem 1.5rem 1.5rem 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .search-tab-btn {
            background: #f8fafc;
            padding: 0.8rem 1.2rem;
            border-radius: 1rem;
            font-size: 0.7rem;
            font-weight: 800;
            text-transform: uppercase;
            color: #94a3b8;
            border: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .search-tab-btn.active {
            border-color: #22c55e;
            color: #22c55e;
            background: #f0fdf4;
        }

        #notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 0.75rem;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            display: none;
            min-width: 250px;
            text-align: center;
        }

        .btn-scan-main {
            width: 48px;
            height: 48px;
            background-color: #22c55e;
            color: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);
        }

        #reader {
            width: 100%;
            border-radius: 1.5rem;
            overflow: hidden;
            margin-bottom: 1rem;
            display: none;
            border: 4px solid #22c55e;
            background: #000;
        }

        .logo-login {
            width: 100px;
            height: 100px;
            border-radius: 1.5rem;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            margin-bottom: 1.5rem;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <div id="notification"></div>
    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, onSnapshot, doc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyByMJBcH3pdeybyyDEEukdGZjB7vxmH4jA",
            authDomain: "embasana-stock-1a7b9.firebaseapp.com",
            projectId: "embasana-stock-1a7b9",
            storageBucket: "embasana-stock-1a7b9.firebasestorage.app",
            appId: "1:5607146974:web:1f9fc894fc31e56ab8894f"
        };

        const fbApp = initializeApp(firebaseConfig);
        const db = getFirestore(fbApp);
        const auth = getAuth(fbApp);
        const currentAppId = 'embasana-stock-prod';

        window.state = {
            view: localStorage.getItem('embasana_user') ? 'dashboard' : 'login',
            user: JSON.parse(localStorage.getItem('embasana_user')) || null,
            inventory: [],
            authorizedUsers: [],
            searchQuery: '',
            searchMode: 'todo',
            isScanning: false,
            flashOn: false,
            tempFormData: { scanCode: '', size: '', gauge: '', material: '', finish: '', color: '' }
        };

        window.showNotify = (msg, type = 'error') => {
            const el = document.getElementById('notification');
            if(!el) return;
            el.innerText = msg;
            el.style.display = 'block';
            el.style.backgroundColor = type === 'error' ? '#ef4444' : '#22c55e';
            el.style.color = 'white';
            setTimeout(() => { el.style.display = 'none'; }, 3000);
        };

        window.handleSearchInput = (input) => {
            window.state.searchQuery = input.value;
            const listContainer = document.getElementById('inventory-list');
            if (listContainer) {
                listContainer.innerHTML = renderInventoryList();
                if (window.lucide) lucide.createIcons();
            }
        };

        const renderInventoryList = () => {
            const query = window.state.searchQuery.toLowerCase().trim();
            const mode = window.state.searchMode;
            const filtered = window.state.inventory.filter(i => {
                if (!query) return true;
                if (mode === 'tamaño') return String(i.size).toLowerCase().includes(query);
                if (mode === 'galga') return String(i.gauge).includes(query);
                if (mode === 'lote') return String(i.batch).toLowerCase().includes(query);
                return String(i.material).toLowerCase().includes(query) || 
                       String(i.batch).toLowerCase().includes(query) || 
                       String(i.scanCode).toLowerCase().includes(query);
            });

            if (filtered.length === 0) return '<p class="text-center text-slate-400 text-xs font-bold py-10">Sin resultados</p>';

            return filtered.map(i => `
                <div class="bg-white p-5 rounded-[2.5rem] flex justify-between items-center shadow-sm border border-slate-50 mb-3">
                    <div class="flex items-center gap-4">
                        <div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center font-black text-xs text-green-600">${i.location}</div>
                        <div>
                            <p class="font-black text-slate-800 text-xs uppercase">${i.material} ${i.size}x${i.gauge}</p>
                            <p class="text-[10px] font-bold text-slate-400 italic uppercase">LOTE: ${i.batch} • ${i.weight}kg</p>
                        </div>
                    </div>
                    <button onclick="deleteItem('${i.id}')" class="text-slate-200 hover:text-red-500 p-2">
                        <i data-lucide="trash-2" class="w-5 h-5"></i>
                    </button>
                </div>
            `).join('');
        };

        window.render = () => {
            const root = document.getElementById('app');
            if (window.state.view === 'login') {
                root.innerHTML = renderLogin();
            } else {
                root.innerHTML = `
                    <div class="max-w-md mx-auto p-6 pb-40">
                        <header class="flex justify-between items-center mb-10">
                            <h1 class="text-2xl font-black italic uppercase tracking-tighter text-slate-900">
                                ${window.state.view === 'entry' ? 'REGISTRO' : 
                                  window.state.view === 'search' ? 'BUSCAR' : 
                                  window.state.view === 'users' ? 'USUARIOS' : 'INICIO'}
                            </h1>
                            <button onclick="logout()" class="text-slate-300 hover:text-slate-500 transition-colors">
                                <i data-lucide="log-out"></i>
                            </button>
                        </header>
                        <div id="view-content">${renderCurrentView()}</div>
                        <div class="tab-bar-container">
                            <div class="tab-bar">
                                <div onclick="setView('dashboard')" class="nav-item ${window.state.view === 'dashboard' ? 'active' : ''}">
                                    <i data-lucide="layout-grid" stroke-width="2.5"></i>
                                </div>
                                <div onclick="setView('entry')" class="btn-plus-center">
                                    <i data-lucide="plus" size="32" stroke-width="3"></i>
                                </div>
                                <div onclick="setView('search')" class="nav-item ${window.state.view === 'search' ? 'active' : ''}">
                                    <i data-lucide="search" stroke-width="2.5"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }
            if (window.lucide) lucide.createIcons();
        };

        const renderLogin = () => `
            <div class="h-screen bg-slate-50 flex flex-col items-center justify-center p-8 text-center">
                <img src="https://i.postimg.cc/3rvnp3Rj/definitivo-logo.png" class="logo-login" alt="Logo ShadowMir">
                <h1 class="text-slate-800 text-3xl font-black uppercase mb-2 tracking-tighter">STOCK CONTROL</h1>
                <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-10">Acceso Restringido</p>
                <div class="w-full max-w-xs space-y-3">
                    <input id="lUser" class="input-box uppercase" placeholder="USUARIO">
                    <input id="lPass" type="password" class="input-box" placeholder="PIN">
                    <button onclick="doLogin()" class="w-full bg-slate-900 text-white p-5 rounded-2xl font-black italic uppercase shadow-xl active:scale-95 transition-all">Entrar</button>
                </div>
            </div>
        `;

        const renderCurrentView = () => {
            if (window.state.view === 'dashboard') {
                const totalKg = window.state.inventory.reduce((a, b) => a + Number(b.weight || 0), 0);
                return `
                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div class="bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
                                <p class="text-4xl font-black text-slate-900">${window.state.inventory.length}</p>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Bobinas</p>
                            </div>
                            <div class="bg-slate-900 p-6 rounded-[2.5rem] text-white shadow-xl shadow-slate-200">
                                <p class="text-2xl font-black text-green-400">${totalKg.toLocaleString()} <span class="text-xs">kg</span></p>
                                <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Stock Total</p>
                            </div>
                        </div>
                        ${window.state.user?.role === 'admin' ? `
                            <div onclick="setView('users')" class="bg-indigo-600 p-6 rounded-[2.5rem] text-white flex justify-between items-center cursor-pointer shadow-lg active:scale-95 transition-transform">
                                <div><p class="text-lg font-black italic uppercase tracking-tighter">Panel Maestro</p><p class="text-[9px] font-bold opacity-70 uppercase tracking-widest">Personal</p></div><i data-lucide="shield-check" class="w-8 h-8 opacity-50"></i>
                            </div>
                        ` : ''}
                        <div class="card-main">
                            <h3 class="text-[10px] font-black text-slate-300 uppercase italic mb-4 tracking-widest">Movimientos</h3>
                            <div class="space-y-4">
                                ${window.state.inventory.slice(0, 5).map(item => `
                                    <div class="flex justify-between items-center border-b border-slate-50 pb-3">
                                        <div><p class="text-xs font-black uppercase text-slate-700">${item.material} ${item.size}x${item.gauge}</p><p class="text-[9px] font-bold text-slate-400 uppercase italic">Lote: ${item.batch}</p></div>
                                        <div class="text-right"><p class="text-xs font-black">${item.weight}kg</p><p class="text-[9px] font-bold text-green-500 uppercase">CALLE ${item.location}</p></div>
                                    </div>
                                `).join('') || '<p class="text-center text-slate-400 text-xs font-bold py-4">Sin datos</p>'}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (window.state.view === 'users') {
                return `
                    <div class="space-y-6">
                        <div class="card-main">
                            <h3 class="text-[10px] font-black text-slate-300 uppercase italic mb-4 tracking-widest">Nuevo</h3>
                            <div class="flex gap-2">
                                <input id="newUserName" class="input-box uppercase" placeholder="NOMBRE">
                                <button onclick="addUser()" class="bg-green-500 text-white p-4 rounded-2xl shadow-lg active:scale-90 transition-transform"><i data-lucide="user-plus"></i></button>
                            </div>
                        </div>
                        <div class="card-main">
                            <h3 class="text-[10px] font-black text-slate-300 uppercase italic mb-4 tracking-widest">Personal</h3>
                            <div class="space-y-3">
                                ${window.state.authorizedUsers.map(u => `<div class="flex justify-between items-center p-4 bg-slate-50 rounded-2xl"><span class="font-black text-xs uppercase tracking-tight text-slate-700">${u.name}</span><button onclick="removeUser('${u.id}')" class="text-slate-300 hover:text-red-500 p-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (window.state.view === 'entry') {
                const d = window.state.tempFormData;
                return `
                    <div class="card-main">
                        <div id="reader"></div>
                        <div class="flex justify-center gap-4 mb-4">
                            <div onclick="startScanner()" class="btn-scan-main active:scale-90 transition-transform m-0">
                                <i data-lucide="${window.state.isScanning ? 'square' : 'scan'}"></i>
                            </div>
                            ${window.state.isScanning ? `
                                <div onclick="toggleFlash()" class="btn-scan-main !bg-amber-500 active:scale-90 transition-transform m-0">
                                    <i data-lucide="${window.state.flashOn ? 'zap-off' : 'zap'}"></i>
                                </div>
                            ` : ''}
                        </div>
                        <div class="w-full mb-6 text-center">
                            <p class="label-text !text-center">CÓDIGO</p>
                            <input id="fScanCode" class="input-box uppercase text-center !bg-slate-50 border-2 border-dashed border-slate-200" placeholder="---" value="${d.scanCode || ''}" oninput="handleManualCode(this.value)">
                        </div>
                        <div class="grid grid-cols-2 gap-x-4 gap-y-4">
                            <div><p class="label-text">Tamaño</p><input id="fSize" type="text" class="input-box uppercase" value="${d.size || ''}"></div>
                            <div><p class="label-text">Galga</p><input id="fGauge" type="number" class="input-box" value="${d.gauge || ''}"></div>
                            <div><p class="label-text">Material</p><input id="fMat" class="input-box uppercase" value="${d.material || ''}"></div>
                            <div><p class="label-text">Acabado</p><input id="fFinish" class="input-box uppercase" value="${d.finish || ''}"></div>
                            <div><p class="label-text">Color</p><input id="fColor" class="input-box uppercase" value="${d.color || ''}"></div>
                            <div class="col-span-2 border-t border-slate-100 pt-4 mt-2"></div>
                            <div class="col-span-2"><p class="label-text">Lote</p><input id="fBatch" class="input-box uppercase"></div>
                            <div><p class="label-text">Peso kg</p><input id="fWeight" type="number" class="input-box"></div>
                            <div><p class="label-text">Calle</p><input id="fLoc" class="input-box uppercase"></div>
                        </div>
                        <button onclick="saveData()" class="btn-confirm">Guardar Bobina</button>
                    </div>
                `;
            }

            if (window.state.view === 'search') {
                return `
                    <div class="space-y-6">
                        <div class="relative">
                            <input class="input-box pl-12 uppercase" placeholder="BUSCAR..." oninput="handleSearchInput(this)">
                            <i data-lucide="search" class="absolute left-4 top-4 text-slate-300 w-5 h-5"></i>
                        </div>
                        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
                            ${['todo', 'tamaño', 'galga', 'lote'].map(m => `
                                <button onclick="setSearchMode('${m}')" class="search-tab-btn ${window.state.searchMode === m ? 'active' : ''}">${m}</button>
                            `).join('')}
                        </div>
                        <div id="inventory-list" class="space-y-1">${renderInventoryList()}</div>
                    </div>
                `;
            }
        };

        window.doLogin = () => {
            const u = document.getElementById('lUser').value.toLowerCase().trim();
            const p = document.getElementById('lPass').value;
            if (u === 'admin' && p === 'master2024') {
                window.state.user = { name: 'Admin', role: 'admin' };
                localStorage.setItem('embasana_user', JSON.stringify(window.state.user));
                window.state.view = 'dashboard';
                render();
            } else {
                window.showNotify("Acceso denegado");
            }
        };

        window.logout = () => {
            localStorage.removeItem('embasana_user');
            window.state.view = 'login';
            render();
        };

        window.setView = (v) => {
            if (window.state.isScanning) stopScanner();
            window.state.view = v;
            render();
        };

        window.setSearchMode = (m) => {
            window.state.searchMode = m;
            render();
        };

        let html5QrCode;
        window.startScanner = async () => {
            if (window.state.isScanning) {
                stopScanner();
                return;
            }

            // CORRECCIÓN: Asegurar visibilidad antes de instanciar
            const readerEl = document.getElementById('reader');
            if (readerEl) readerEl.style.display = 'block';

            window.state.isScanning = true;
            render();

            html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 20, qrbox: { width: 280, height: 150 } },
                    (text) => {
                        const found = window.state.inventory.find(i => i.scanCode === text.trim().toUpperCase());
                        window.state.tempFormData = { 
                            scanCode: text.trim().toUpperCase(), 
                            size: found?.size || '', 
                            gauge: found?.gauge || '', 
                            material: found?.material || '',
                            finish: found?.finish || '',
                            color: found?.color || ''
                        };
                        window.showNotify("Escaneado", "success");
                        stopScanner();
                    },
                    () => {}
                );
            } catch (err) {
                window.showNotify("Error de cámara");
                if (readerEl) readerEl.style.display = 'none';
                window.state.isScanning = false;
                render();
            }
        };

        window.toggleFlash = async () => {
            if (html5QrCode?.isScanning) {
                const videoTrack = html5QrCode.getRunningTrack();
                if (videoTrack && videoTrack.getCapabilities().torch) {
                    window.state.flashOn = !window.state.flashOn;
                    await videoTrack.applyConstraints({ advanced: [{ torch: window.state.flashOn }] });
                    render();
                }
            }
        };

        const stopScanner = () => {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    const readerEl = document.getElementById('reader');
                    if (readerEl) readerEl.style.display = 'none';
                    window.state.isScanning = false;
                    render();
                }).catch(() => {
                    const readerEl = document.getElementById('reader');
                    if (readerEl) readerEl.style.display = 'none';
                    window.state.isScanning = false;
                    render();
                });
            }
        };

        window.handleManualCode = (val) => {
            const found = window.state.inventory.find(i => i.scanCode === val.trim().toUpperCase());
            if (found) {
                window.state.tempFormData = { 
                    scanCode: val.trim().toUpperCase(), 
                    size: found.size, 
                    gauge: found.gauge, 
                    material: found.material,
                    finish: found.finish || '',
                    color: found.color || ''
                };
                render();
            } else {
                window.state.tempFormData.scanCode = val.toUpperCase();
            }
        };

        window.saveData = async () => {
            const data = {
                scanCode: document.getElementById('fScanCode').value.toUpperCase(),
                size: document.getElementById('fSize').value.toUpperCase(),
                gauge: document.getElementById('fGauge').value,
                material: document.getElementById('fMat').value.toUpperCase(),
                finish: document.getElementById('fFinish').value.toUpperCase(),
                color: document.getElementById('fColor').value.toUpperCase(),
                batch: document.getElementById('fBatch').value.toUpperCase(),
                weight: document.getElementById('fWeight').value,
                location: document.getElementById('fLoc').value.toUpperCase(),
                createdAt: Date.now()
            };

            if (!data.batch || !data.location || !data.weight) {
                return window.showNotify("Faltan datos críticos");
            }

            try {
                await addDoc(collection(db, 'artifacts', currentAppId, 'public', 'data', 'inventory'), data);
                window.showNotify("Guardado", "success");
                window.state.tempFormData = { scanCode: '', size: '', gauge: '', material: '', finish: '', color: '' };
                window.state.view = 'dashboard';
                render();
            } catch (e) {
                window.showNotify("Error al guardar");
            }
        };

        window.deleteItem = async (id) => {
            if (confirm("¿Borrar bobina?")) {
                await deleteDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'inventory', id));
                window.showNotify("Borrado", "success");
            }
        };

        window.addUser = async () => {
            const name = document.getElementById('newUserName').value.toUpperCase().trim();
            if (!name) return;
            await addDoc(collection(db, 'artifacts', currentAppId, 'public', 'data', 'users'), { name });
            document.getElementById('newUserName').value = '';
        };

        window.removeUser = async (id) => {
            await deleteDoc(doc(db, 'artifacts', currentAppId, 'public', 'data', 'users', id));
        };

        window.onload = async () => {
            await signInAnonymously(auth);
            
            onSnapshot(collection(db, 'artifacts', currentAppId, 'public', 'data', 'inventory'), (snap) => {
                window.state.inventory = snap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.createdAt - a.createdAt);
                render();
            });

            onSnapshot(collection(db, 'artifacts', currentAppId, 'public', 'data', 'users'), (snap) => {
                window.state.authorizedUsers = snap.docs.map(d => ({id: d.id, ...d.data()}));
                render();
            });
        };
    </script>
</body>
</html>
